# .github/dependabot.yml
# ✅ ZERO-DEFECT: Dependabot-Konfiguration
# - Major-Updates werden ignoriert (Breaking Changes erfordern manuelle Migration)
# - Minor/Patch werden gruppiert (weniger PR-Spam)
# - Keine nicht-existierenden Labels (behebt Dependabot-Warnung)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
