<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Kiosk Lollipop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%);
      padding: 1rem;
    }
    .container {
      max-width: 480px;
      background: white;
      border-radius: 24px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      text-align: center;
    }
    .icon { font-size: 5rem; margin-bottom: 1rem; }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ec4899, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p {
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: linear-gradient(90deg, #ec4899, #a855f7);
      color: white;
      border: none;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
    }
    .info {
      margin-top: 2rem;
      padding: 1rem;
      background: #f9fafb;
      border-radius: 12px;
      font-size: 0.875rem;
      color: #6b7280;
    }
    .info strong { color: #111827; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Keine Verbindung</h1>
    <p>
      Du bist gerade offline. Sobald du wieder mit dem Internet verbunden bist,
      kannst du unsere Seite wieder normal nutzen.
    </p>
    <button onclick="window.location.reload()">
      🔄 Erneut versuchen
    </button>
    <div class="info">
      <strong>Kiosk Lollipop</strong><br>
      Theodor-Heuss-Straße 35<br>
      50374 Erftstadt-Liblar<br>
      📞 02235 9291160
    </div>
  </div>
</body>
</html>
